services:
  postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-cloudpulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudpulse_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudpulse} -d ${POSTGRES_DB:-cloudpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_rules:/etc/prometheus/rules
      - prometheus_file_sd:/etc/prometheus/file_sd
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - cloudpulse_internal
    depends_on:
      prometheus-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - cloudpulse_internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - cloudpulse_internal
      - cloudpulse_edge
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus-init:
    image: alpine:3.21.3
    command: >
      sh -c "
      mkdir -p /etc/prometheus/file_sd /etc/prometheus/rules &&
      cp -f /seed/rules/*.yml /etc/prometheus/rules/ &&
      [ -f /etc/prometheus/file_sd/targets.json ] || echo '[]' > /etc/prometheus/file_sd/targets.json &&
      chown -R 10001:10001 /etc/prometheus/file_sd /etc/prometheus/rules &&
      chmod -R a+rX /etc/prometheus/file_sd /etc/prometheus/rules
      "
    volumes:
      - ./infrastructure/prometheus/rules:/seed/rules:ro
      - prometheus_rules:/etc/prometheus/rules
      - prometheus_file_sd:/etc/prometheus/file_sd
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudpulse}:${POSTGRES_PASSWORD:-change-me-strong-db-password}@postgres:5432/${POSTGRES_DB:-cloudpulse}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-use-a-long-random-32-plus-char-secret-key}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_FILE_SD_PATH: /etc/prometheus/file_sd/targets.json
      PROMETHEUS_RULES_DIR: /etc/prometheus/rules
      PROMETHEUS_RELOAD_ENABLED: "true"
      GRAFANA_URL: http://grafana:3000
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3001}
      ALERTMANAGER_URL: http://alertmanager:9093
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - prometheus_file_sd:/etc/prometheus/file_sd
      - prometheus_rules:/etc/prometheus/rules
    ports:
      - "8080:8080"
    networks:
      - cloudpulse_internal
      - cloudpulse_edge
    depends_on:
      postgres:
        condition: service_healthy
      prometheus-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_APP_ENV: ${APP_ENV:-production}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:8080"
    networks:
      - cloudpulse_edge
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # Optional local monitoring agents for multi-server verification:
  # Run with: docker compose --profile agents up -d --build
  agent-node-1:
    profiles: ["agents"]
    build:
      context: ./agent
      dockerfile: ../infrastructure/docker/agent.Dockerfile
    restart: unless-stopped
    environment:
      AGENT_ID: "docker-node-1"
      AGENT_NAME: "app-server-01"
      AGENT_ENVIRONMENT: "production"
      AGENT_LISTEN_ADDRESS: "0.0.0.0:9180"
      AGENT_COLLECTION_INTERVAL: "10s"
    networks:
      - cloudpulse_internal
    deploy:
      resources:
        limits:
          memory: 128M

  agent-node-2:
    profiles: ["agents"]
    build:
      context: ./agent
      dockerfile: ../infrastructure/docker/agent.Dockerfile
    restart: unless-stopped
    environment:
      AGENT_ID: "docker-node-2"
      AGENT_NAME: "db-server-01"
      AGENT_ENVIRONMENT: "staging"
      AGENT_LISTEN_ADDRESS: "0.0.0.0:9180"
      AGENT_COLLECTION_INTERVAL: "10s"
    networks:
      - cloudpulse_internal
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  prometheus_data:
  prometheus_file_sd:
  prometheus_rules:
  alertmanager_data:
  grafana_data:

networks:
  cloudpulse_internal:
    driver: bridge
  cloudpulse_edge:
    driver: bridge
