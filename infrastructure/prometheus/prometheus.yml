global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    platform: "cloudpulse"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "cloudpulse-agents"
    metrics_path: "/metrics"
    file_sd_configs:
      - files:
          - "/etc/prometheus/file_sd/*.json"
        refresh_interval: 15s
