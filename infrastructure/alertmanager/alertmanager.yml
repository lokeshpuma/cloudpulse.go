# CloudPulse Alertmanager Configuration
# Alertmanager is the sole notification routing and deduplication engine.
# Inject real SMTP, Slack, or Webhook credentials via secret files or secure deployment templates.

global:
  resolve_timeout: 5m

route:
  receiver: "default-log"
  group_by: ["alertname", "cloudpulse_server_id", "environment", "severity"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: "critical-ops"
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: "warning-ops"
      repeat_interval: 4h

inhibit_rules:
  # Suppress warning alerts if a critical alert of the same category is firing on the same server
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["cloudpulse_server_id", "category"]

receivers:
  - name: "default-log"
    # Replace with your email_configs / slack_configs / webhook_configs in production.
    # See docs/alerting.md for secret-file mounted SMTP, Slack, and Webhook examples.

  - name: "critical-ops"
    # Example Slack receiver (mount secret file in production):
    # slack_configs:
    #   - api_url_file: "/run/secrets/slack_webhook_url"
    #     channel: "#infra-critical"
    #     send_resolved: true
    # Example Email receiver:
    # email_configs:
    #   - to: "oncall@example.com"
    #     smarthost: "smtp.example.com:587"
    #     from: "alerts@example.com"
    #     auth_username: "alerts@example.com"
    #     auth_password_file: "/run/secrets/smtp_password"

  - name: "warning-ops"
    # Example Generic Webhook receiver:
    # webhook_configs:
    #   - url: "https://hooks.example.com/cloudpulse-warnings"
    #     send_resolved: true
